services:
  db:
    image: pgvector/pgvector:pg16
    container_name: control_tower_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-control_tower}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-control_tower_pass}
      POSTGRES_DB: ${POSTGRES_DB:-control_tower_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      # -d flag ensures the specific database exists before marking healthy
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-control_tower} -d ${POSTGRES_DB:-control_tower_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: control_tower_api
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-control_tower}:${POSTGRES_PASSWORD:-control_tower_pass}@db:5432/${POSTGRES_DB:-control_tower_db}
      # Default allowed scan roots. /workspace maps to HOST_REPOS_PATH on the host.
      ALLOWED_SCAN_PATHS: ${ALLOWED_SCAN_PATHS:-["/app","/workspace"]}
    ports:
      - "8013:8000"
    volumes:
      - .:/app
      # Bind-mount the host repos directory so the API can scan target projects.
      # HOST_REPOS_PATH is set in .env (e.g. C:/Users/ORENS).
      # Inside the container repos appear at /workspace/<repo-name>.
      - ${HOST_REPOS_PATH:-/tmp/repos}:/workspace:ro
    command: sh /app/entrypoint.sh

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: control_tower_ui
    depends_on:
      - api
    environment:
      API_BASE_URL: http://api:8000/api/v1
    ports:
      - "8513:8501"
    volumes:
      - .:/app

  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: control_tower_prometheus
    depends_on:
      - api
    ports:
      - "9092:9090"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"

  grafana:
    image: grafana/grafana:10.4.2
    container_name: control_tower_grafana
    depends_on:
      - prometheus
    ports:
      - "3012:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observability/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
